<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audio DJ — Web Master</title>
  <style>
    :root {
      --bg-dark: #121418;
      --card-bg: #1e222b;
      --card-border: #2e3440;
      --text-main: #f0f2f5;
      --text-sub: #a0a8b6;
      --accent-green: #2ecc71;
      --accent-blue: #3498db;
      --accent-red: #e74c3c;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    h1, h2, h3 {
      margin-top: 0;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    label {
      font-weight: 600;
      font-size: 14px;
      min-width: 110px;
    }
    input[type="text"], input[type="url"], select {
      background: #121418;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 4px;
      flex: 1;
      min-width: 200px;
      font-size: 14px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-blue);
    }
    .val-badge {
      font-family: monospace;
      font-size: 13px;
      min-width: 50px;
      text-align: right;
      color: var(--accent-blue);
    }
    button {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.btn-danger {
      background: var(--accent-red);
    }
    button.btn-success {
      background: var(--accent-green);
    }
    #status {
      font-size: 16px;
      font-weight: bold;
    }
    .status-connected { color: var(--accent-green); }
    .status-disconnected { color: var(--text-sub); }
    .status-error { color: var(--accent-red); }
    pre {
      background: #0a0b0e;
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      overflow-x: auto;
      max-height: 200px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Audio DJ — Master Web Subscriber</h1>

    <!-- Go Backend Settings & Connection -->
    <div class="card">
      <h3>Go Backend Connection</h3>
      <div class="row">
        <label for="backendUrlInput">Backend URL:</label>
        <input type="text" id="backendUrlInput" value="http://localhost:8080" placeholder="http://localhost:8080" />
        <button id="connectBtn">Connect</button>
        <button id="disconnectBtn" class="btn-danger" disabled>Disconnect</button>
      </div>
      <div class="row">
        <label>Status:</label>
        <span id="status" class="status-disconnected">Disconnected</span>
        <button id="startAudioBtn" class="btn-success" style="margin-left: auto;">Start Audio</button>
      </div>
    </div>

    <!-- Real-Time DJ Controls (RTCDataChannel Emitter) -->
    <div class="card">
      <h3>Master DJ Controls</h3>
      <div class="row" style="margin-bottom: 20px;">
        <label for="targetDeckSelect">Target Deck:</label>
        <select id="targetDeckSelect">
          <option value="deck-a">Deck A</option>
          <option value="deck-b">Deck B</option>
        </select>
      </div>

      <!-- Crossfader -->
      <div class="card" style="background: #161920;">
        <div class="row">
          <label for="crossfaderInput">Crossfader:</label>
          <input type="range" id="crossfaderInput" min="0.0" max="1.0" step="0.01" value="0.5" />
          <span id="crossfaderVal" class="val-badge">0.50</span>
        </div>
      </div>

      <!-- EQ Controls -->
      <div class="card" style="background: #161920;">
        <h4 style="margin-top: 0; margin-bottom: 12px;">3-Band Equalizer (dB)</h4>
        <div class="row">
          <label for="eqLowInput">Low EQ:</label>
          <input type="range" id="eqLowInput" min="-12.0" max="12.0" step="0.1" value="0.0" />
          <span id="eqLowVal" class="val-badge">0.0 dB</span>
        </div>
        <div class="row">
          <label for="eqMidInput">Mid EQ:</label>
          <input type="range" id="eqMidInput" min="-12.0" max="12.0" step="0.1" value="0.0" />
          <span id="eqMidVal" class="val-badge">0.0 dB</span>
        </div>
        <div class="row">
          <label for="eqHighInput">High EQ:</label>
          <input type="range" id="eqHighInput" min="-12.0" max="12.0" step="0.1" value="0.0" />
          <span id="eqHighVal" class="val-badge">0.0 dB</span>
        </div>
      </div>

      <!-- Gain & Tempo -->
      <div class="grid-2">
        <div class="card" style="background: #161920; margin-bottom: 0;">
          <div class="row">
            <label for="gainInput">Gain:</label>
            <input type="range" id="gainInput" min="0.0" max="2.0" step="0.01" value="1.0" />
            <span id="gainVal" class="val-badge">1.00</span>
          </div>
        </div>
        <div class="card" style="background: #161920; margin-bottom: 0;">
          <div class="row">
            <label for="tempoInput">Tempo:</label>
            <input type="range" id="tempoInput" min="0.5" max="2.0" step="0.01" value="1.0" />
            <span id="tempoVal" class="val-badge">1.00x</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Status & Debug Log -->
    <div class="card">
      <h3>Connection State</h3>
      <pre id="detail">Ready.</pre>
    </div>
  </div>

  <script type="module" src="/main.ts"></script>
</body>
</html>
